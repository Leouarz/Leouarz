<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="262" viewBox="0 0 400 262" role="img" aria-label="Infinity DA. Helped build Avail's Rust/Polkadot chain, then proposed Infinity DA: sharding, redesigned validation and a new P2P network. 4 MB / 20 s  →  2 GB / 6 s. Stack: Rust, Tokio, libp2p, Polkadot.">
<title>Infinity DA. Helped build Avail's Rust/Polkadot chain, then proposed Infinity DA: sharding, redesigned validation and a new P2P network. 4 MB / 20 s  →  2 GB / 6 s. Stack: Rust, Tokio, libp2p, Polkadot.</title>
